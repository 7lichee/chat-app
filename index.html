<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">

<title>水仙</title>

<meta name="viewport"
content="
width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<link rel="apple-touch-icon"
sizes="180x180"
href="icon.png">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta
name="apple-mobile-web-app-title"
content="水仙">

<style>

html,body{

margin:0;
padding:0;

height:100%;

overflow:hidden;

font-family:
-apple-system,
BlinkMacSystemFont,
sans-serif;

background:#f7f6f3;

color:#2c2c2c;

}

#app{

height:100%;

display:flex;

flex-direction:column;

}

#chat{

flex:1;

overflow-y:auto;

padding:

20px
14px
120px;

box-sizing:border-box;

-webkit-overflow-scrolling:touch;

}

.msg{

display:block;

width:fit-content;

padding:

12px
16px;

margin:

10px
0;

border-radius:16px;

max-width:78%;

font-size:15px;

line-height:1.6;

word-break:break-word;

}

.me1{

background:#e6efe9;

margin-left:auto;

}

.me2{

background:#fff;

margin-right:auto;

border:

1px solid #ececec;

}

.date-wrapper{

text-align:center;

position:relative;

pointer-events:none;

}

.date-badge{

display:inline-block;

background:

rgba(
229,
229,
229,
0.92
);

backdrop-filter:
blur(10px);

color:#666;

font-size:12px;

padding:

4px
10px;

border-radius:12px;

margin:

20px
auto
10px;

box-shadow:

0 1px 4px
rgba(
0,
0,
0,
0.05
);

}

#inputArea{

position:fixed;

left:0;
right:0;
bottom:0;

display:flex;

align-items:flex-end;

gap:8px;

padding:10px;

padding-bottom:

calc(
10px +
env(safe-area-inset-bottom)
);

background:

rgba(
247,
246,
243,
0.9
);

backdrop-filter:blur(12px);

transform:translateY(0);

transition:

transform .18s ease;

}

textarea{

flex:1;

font-size:16px;

line-height:20px;

padding:

8px
14px;

min-height:36px;

max-height:120px;

border:none;

outline:none;

resize:none;

overflow-y:auto;

box-sizing:border-box;

border-radius:20px;

background:#fff;

}

.icon-btn{

background:none;

border:none;

font-size:20px;

padding:6px;

}

.send-btn{

width:36px;

height:36px;

border:none;

border-radius:50%;

background:#dfeee7;

color:#4f7f6f;

display:flex;

align-items:center;

justify-content:center;

font-size:16px;

}

</style>

</head>

<body>

<div id="app">

<div id="chat"></div>

<div id="inputArea">

<button
class="icon-btn"
id="roleBtn"
onclick="switchRole()"
onmousedown="event.preventDefault()">

🍋‍🟩

</button>

<textarea id="text" rows="1" placeholder="写下一点想法..."></textarea>

<button
class="send-btn"
onclick="send()"
onmousedown="event.preventDefault()">

↑

</button>

<button
class="icon-btn"
onclick="exportTxt()">

☁️

</button>

</div>

</div>

<script>

let role="A"

let messages=
JSON.parse(
localStorage.getItem("chat")
||"[]"
)

messages=
messages.map(m=>{

if(!m.time)
m.time=
new Date()
.toISOString()

return m

})

const chat=
document.getElementById("chat")

const textarea=
document.getElementById("text")
textarea.value=""
const inputArea=
document.getElementById("inputArea")


/* ---------- 保存节流 ---------- */

let saveTimer

function saveMessages(){

clearTimeout(saveTimer)

saveTimer=
setTimeout(()=>{

localStorage.setItem(
"chat",
JSON.stringify(messages)
)

},300)

}


/* ---------- 日期 ---------- */

function formatDate(str){

const d=
new Date(str)

return (
`${d.getFullYear()}.`+

`${String(
d.getMonth()+1
).padStart(2,"0")}.`+

`${String(
d.getDate()
).padStart(2,"0")}`
)

}

/* ---------- 滚动 ---------- */

function scrollToBottom(){

requestAnimationFrame(()=>{

chat.scrollTop=
chat.scrollHeight

})

}


/* ---------- 添加单条 ---------- */

let lastRenderedDate=""

function appendMessage(
m,
index
){

const date=
formatDate(m.time)

if(
date!==lastRenderedDate
){

const wrap=
document.createElement("div")

wrap.className=
"date-wrapper"

wrap.innerHTML=

`<div class="date-badge">

${date}

</div>`

chat.appendChild(wrap)

lastRenderedDate=date

}

const div=
document.createElement("div")

div.className=

"msg "+

(
m.role==="A"
?
"me1"
:
"me2"
)

div.innerText=m.text

div.dataset.index=index

chat.appendChild(div)

}


/* ---------- 初始渲染 ---------- */

function renderInitial(){

chat.innerHTML=""

lastRenderedDate=""

messages.forEach(
(m,i)=>
appendMessage(
m,
i
)
)

scrollToBottom()

}

renderInitial()


/* ---------- 输入框 ---------- */

textarea.addEventListener(
"input",
()=>{

requestAnimationFrame(()=>{

textarea.style.height=
"36px"

textarea.style.height=

textarea.scrollHeight
+"px"

})

}
)


/* ---------- 发送 ---------- */

function send(){

const text=
textarea.value.trim()

if(!text)return

const msg={

role,

text,

time:
new Date()
.toISOString()

}

messages.push(msg)

appendMessage(
msg,
messages.length-1
)

saveMessages()

textarea.value=""

textarea.style.height=
"36px"

scrollToBottom()

setTimeout(
()=>textarea.focus(),
0
)

}


/* ---------- 切换角色 ---------- */

function switchRole(){

role=
role==="A"
?
"B"
:
"A"

roleBtn.innerText=

role==="A"
?
"🍋‍🟩"
:
"🤍"

}


/* ---------- 长按删除（事件委托） ---------- */

let pressTimer
let targetMsg

chat.addEventListener(
"touchstart",
e=>{

const msg=
e.target.closest(".msg")

if(!msg)return

targetMsg=msg

pressTimer=
setTimeout(()=>{

if(
confirm(
"删除这条消息？"
)
){

const index=
Number(
msg.dataset.index
)

messages.splice(
index,
1
)

saveMessages()

renderInitial()

}

},500)

}
)

chat.addEventListener(
"touchend",
()=>{

clearTimeout(
pressTimer
)

}
)

chat.addEventListener(
"touchmove",
()=>{

clearTimeout(
pressTimer
)

}
)


/* ---------- 导出 ---------- */

function exportTxt(){

const start=
prompt(
"开始日期 (2026-05-01)"
)

const end=
prompt(
"结束日期 (2026-05-04)"
)

if(
!start||
!end
)return

const startDate =
new Date(
start.replace(/-/g,"/")
)

const endDate =
new Date(
end.replace(/-/g,"/")
)

endDate.setHours(
23,
59,
59,
999
)

const filtered =
messages.filter(m=>{

const msgDate =
new Date(m.time)

return (

msgDate >= startDate &&

msgDate <= endDate

)

})

let text=""

let lastDate=""

filtered.forEach(m=>{

const d=
formatDate(m.time)

if(d!==lastDate){

text+=`\n${d}\n`

lastDate=d

}

text+=

`${m.role}: `+

`${m.text}\n`

})

const blob=
new Blob(
[text],
{
type:
"text/plain;charset=utf-8"
}
)

const url=
URL.createObjectURL(
blob
)

const a=
document.createElement(
"a"
)

a.href=url

a.download=

`${start.replace(/-/g,'.')}`+

`-${end.replace(/-/g,'.')}.txt`

document.body.appendChild(a)

a.click()

document.body.removeChild(a)

setTimeout(()=>{

URL.revokeObjectURL(url)

},1000)

}


/* ---------- 键盘 ---------- */

if(
window.visualViewport
){

let resizeTimer

visualViewport
.addEventListener(
"resize",
()=>{

clearTimeout(
resizeTimer
)

resizeTimer=
setTimeout(()=>{

const diff=

window.innerHeight-

visualViewport.height

const keyboard=

diff>100
?
diff
:
0

inputArea
.style.transform=

`translateY(-${keyboard}px)`

scrollToBottom()

},16)

})

}


/* ---------- 防抖动 ---------- */

document.body
.addEventListener(
"touchmove",
e=>{

if(
e.target.closest(
"#chat"
)
)return

e.preventDefault()

},
{
passive:false
}
)

</script>

</body>

</html>
